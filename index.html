<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision X</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>VISION X</h1>
            <p>VR Therapy AI Assistant</p>
        </header>
        
        <main>
            <div class="chat-container">
                <div class="chat-messages" id="chatMessages">
                    <div class="message system">
                        Welcome! I'm your AI therapy assistant. Please share your trauma details, and I'll help create a personalized therapy schedule.
                    </div>
                </div>
                
                <div class="input-container">
                    <textarea id="userInput" placeholder="Describe your trauma or mental health concerns..."></textarea>
                    <button id="sendButton">Send</button>
                </div>
            </div>

            <div class="schedule-container" id="scheduleContainer">
                <h2>Your Therapy Schedule</h2>
                <div class="calendar-section">
                    <h3>Select Available Dates</h3>
                    <div class="calendar-wrapper">
                        <input type="text" id="calendar" placeholder="Select dates...">
                    </div>
                    <button id="scheduleButton" class="schedule-btn">Schedule Sessions</button>
                </div>
                <div id="scheduleContent"></div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="script.js"></script>
</body>
</html>
